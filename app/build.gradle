plugins {
    id 'com.android.application'
}

// The TMDB key lives in secrets.properties (gitignored): tmdb.key=<v3 api key>
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }

android {
    namespace 'com.luke.watchnow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luke.watchnow'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'TMDB_KEY', '"' + secrets.getProperty('tmdb.key', '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
